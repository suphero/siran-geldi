# main'e her push: önce smoke testi (yerel wrangler dev), geçerse Cloudflare'e deploy.
# Gerekli repo secret'ları: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" şablonu), CLOUDFLARE_ACCOUNT_ID.
# ADMIN_PASSWORD, VAPID_PRIVATE_KEY, TURNSTILE_SECRET, LEMON_API_KEY, LEMON_WEBHOOK_SECRET Cloudflare'de secret olarak durur,
# deploy onlara dokunmaz.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Üst üste push'larda deploy'lar sırayla çalışsın, yarıda kesilmesin
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Yerel test ortamı: smoke.mjs varsayılan şifresi "test"; VAPID anahtarı yok, push gönderimi atlanır
      # (cihaz bağlama kodunun anahtarı üretimde VAPID'den türetilir, burada LINK_SECRET).
      # Turnstile'ın her zaman geçen test anahtarları; DEV=1 e-posta bağlantılarını günlüğe yazar (smoke.mjs WRANGLER_LOG'dan okur)
      - run: |
          cat > .dev.vars <<'EOF'
          ADMIN_PASSWORD=test
          LINK_SECRET=test-link-secret
          DEV=1
          LEMON_TEST=1
          LEMON_WEBHOOK_SECRET=test-webhook-secret
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA
          PACKAGES=[{"variant":"111","tickets":500,"price":"49 ₺"}]
          EOF
      - name: Smoke test
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8787/api/vapid > /dev/null && break; sleep 1; done
          WRANGLER_LOG=wrangler.log node smoke.mjs
      - if: failure()
        run: cat wrangler.log

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # wrangler.jsonc'taki build komutu (npm run build) deploy'dan önce çalışır
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
